services:
  # =========================================================================
  # Permissio Authorization Engine
  # =========================================================================
  permissio:
    build:
      context: .
      dockerfile: Dockerfile
    image: permissio:latest
    container_name: permissio-app
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-permissio}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-permissio}
      - PERMISSIO_JWT_PRIVATE_KEY=${PERMISSIO_JWT_PRIVATE_KEY:-}
      - PERMISSIO_JWT_PUBLIC_KEY=${PERMISSIO_JWT_PUBLIC_KEY:-}
      - PERMISSIO_API_KEY_SALT=${PERMISSIO_API_KEY_SALT:-permissio-docker-salt-for-dev-only}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_ENABLED=true
    ports:
      - "${PERMISSIO_PORT:-8080}:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # PostgreSQL 16 Database
  # =========================================================================
  postgres:
    image: 'postgres:16-alpine'
    container_name: permissio-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-permissio}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-permissio}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =========================================================================
  # OpenTelemetry Collector
  # =========================================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: permissio-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus metrics exporter
    restart: unless-stopped

  # =========================================================================
  # Jaeger Distributed Tracing UI
  # =========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: permissio-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
    restart: unless-stopped

volumes:
  pgdata:
