spring:
  application:
    name: permissio
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  docker:
    compose:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

permissio:
  jwt:
    secret: ${PERMISSIO_JWT_SECRET:permissio-dev-secret-key-change-in-production-min-32-chars!!}
    expiration-ms: 900000
  api-key:
    salt: ${PERMISSIO_API_KEY_SALT:permissio-dev-salt-change-in-production}
