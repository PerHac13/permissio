spring:
  datasource:
    url: jdbc:h2:mem:permissio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
