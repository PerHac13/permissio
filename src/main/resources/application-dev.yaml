spring:
  datasource:
    url: jdbc:h2:mem:permissio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: true
    properties:
      "[hibernate.format_sql]": true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-},%X{clientId:-}]"

permissio:
  jwt:
    # RS256 keys auto-generated by RsaKeyProvider in dev profile — no manual config needed
    expiration-ms: 900000
  api-key:
    salt: local-dev-salt-not-for-production-use
  observability:
    otel:
      enabled: ${OTEL_ENABLED:true}
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
      protocol: ${OTEL_EXPORTER_OTLP_PROTOCOL:http/protobuf}
      sampling-probability: ${OTEL_SAMPLING_PROBABILITY:1.0}
      traces:
        enabled: ${OTEL_TRACES_ENABLED:true}
      metrics:
        enabled: ${OTEL_METRICS_ENABLED:true}
      logs:
        enabled: ${OTEL_LOGS_ENABLED:false} # Option in config whether to emit logs to OTel
    logging:
      console:
        enabled: ${LOGGING_CONSOLE_ENABLED:true} # Console log is up
        structured: ${LOGGING_CONSOLE_STRUCTURED:false} # Human readable in dev
