spring:
  datasource:
    url: jdbc:h2:mem:permissio_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    show-sql: false
  flyway:
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{trace_id:-},%X{span_id:-},%X{clientId:-}]"

permissio:
  jwt:
    secret: test-profile-secret-key-not-for-production-use-32chars
  api-key:
    salt: test-profile-salt-not-for-production-use
  observability:
    otel:
      enabled: false
    logging:
      console:
        enabled: true
        structured: false
