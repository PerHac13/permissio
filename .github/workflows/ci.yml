name: Permissio CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Unit & Integration Tests (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make scripts executable
        run: chmod +x ./mvnw scripts/*.sh 2>/dev/null || true

      - name: Build and run tests with JaCoCo coverage gate (>= 80%)
        run: ./mvnw clean verify -Dspring.profiles.active=test --batch-mode --no-transfer-progress
        env:
          PERMISSIO_API_KEY_SALT: ${{ secrets.PERMISSIO_API_KEY_SALT || 'ci-api-key-salt-fallback-abc123-PerHac13' }}

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  docker-independence-acceptance:
    name: Independence Acceptance Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Independence Acceptance Test
        run: ./scripts/independence-acceptance.sh

      - name: Inspect Docker logs on failure
        if: failure()
        run: docker compose logs
