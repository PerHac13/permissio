name: Permissio CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Unit & Integration Tests (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make scripts executable
        run: chmod +x ./mvnw scripts/*.sh 2>/dev/null || true

      - name: Build and run tests with JaCoCo coverage gate (>= 80%)
        run: ./mvnw clean verify -Dspring.profiles.active=test --batch-mode --no-transfer-progress
        env:
          PERMISSIO_API_KEY_SALT: ${{ secrets.PERMISSIO_API_KEY_SALT || 'ci-api-key-salt-fallback-abc123-PerHac13' }}

      - name: Generate Tabular Test & Coverage Summary
        if: always()
        run: |
          echo ""
          echo "============================================================================================="
          echo "                              JACOCO CODE COVERAGE SUMMARY                                  "
          echo "============================================================================================="
          
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' '
            NR>1 {
              ins_m += $4; ins_c += $5;
              br_m += $6; br_c += $7;
              ln_m += $8; ln_c += $9;
              mtd_m += $12; mtd_c += $13;
              cls_total++; if ($4 > 0 && $5 == 0) cls_missed++; else cls_covered++;
            }
            END {
              ins_tot = ins_m + ins_c;
              br_tot = br_m + br_c;
              ln_tot = ln_m + ln_c;
              mtd_tot = mtd_m + mtd_c;
              
              ins_pct = (ins_tot > 0 ? (ins_c / ins_tot) * 100 : 0);
              br_pct = (br_tot > 0 ? (br_c / br_tot) * 100 : 0);
              ln_pct = (ln_tot > 0 ? (ln_c / ln_tot) * 100 : 0);
              mtd_pct = (mtd_tot > 0 ? (mtd_c / mtd_tot) * 100 : 0);
              cls_pct = (cls_total > 0 ? (cls_covered / cls_total) * 100 : 0);
              
              printf "  %-16s %10s %10s %10s %14s %12s\n", "Metric", "Total", "Covered", "Missed", "Coverage %", "Gate (>=80%)";
              printf "---------------------------------------------------------------------------------------------\n";
              printf "  %-16s %10d %10d %10d %13.2f%% %12s\n", "Instructions", ins_tot, ins_c, ins_m, ins_pct, (ins_pct >= 80 ? "PASSED" : "FAILED");
              printf "  %-16s %10d %10d %10d %13.2f%% %12s\n", "Branches", br_tot, br_c, br_m, br_pct, (br_pct >= 80 ? "PASSED" : "FAILED");
              printf "  %-16s %10d %10d %10d %13.2f%% %12s\n", "Lines", ln_tot, ln_c, ln_m, ln_pct, (ln_pct >= 80 ? "PASSED" : "FAILED");
              printf "  %-16s %10d %10d %10d %13.2f%% %12s\n", "Methods", mtd_tot, mtd_c, mtd_m, mtd_pct, (mtd_pct >= 80 ? "PASSED" : "FAILED");
              printf "  %-16s %10d %10d %10d %13.2f%% %12s\n", "Classes", cls_total, cls_covered, cls_missed, cls_pct, (cls_pct >= 80 ? "PASSED" : "FAILED");
              printf "=============================================================================================\n";
            }' target/site/jacoco/jacoco.csv
            
            # Write rich Markdown to GitHub Step Summary
            echo "## Permissio CI Build & Test Report" >> $GITHUB_STEP_SUMMARY
            echo "### JaCoCo Code Coverage (Enforced Gate: >= 80%)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Total | Covered | Missed | Coverage | Gate Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            
            awk -F',' '
            NR>1 {
              ins_m += $4; ins_c += $5;
              br_m += $6; br_c += $7;
              ln_m += $8; ln_c += $9;
              mtd_m += $12; mtd_c += $13;
              cls_total++; if ($4 > 0 && $5 == 0) cls_missed++; else cls_covered++;
            }
            END {
              ins_tot = ins_m + ins_c; br_tot = br_m + br_c; ln_tot = ln_m + ln_c; mtd_tot = mtd_m + mtd_c;
              ins_pct = (ins_tot > 0 ? (ins_c / ins_tot) * 100 : 0);
              br_pct = (br_tot > 0 ? (br_c / br_tot) * 100 : 0);
              ln_pct = (ln_tot > 0 ? (ln_c / ln_tot) * 100 : 0);
              mtd_pct = (mtd_tot > 0 ? (mtd_c / mtd_tot) * 100 : 0);
              cls_pct = (cls_total > 0 ? (cls_covered / cls_total) * 100 : 0);
              
              printf "| **Instructions** | %d | %d | %d | **%.2f%%** | %s |\n", ins_tot, ins_c, ins_m, ins_pct, (ins_pct >= 80 ? "PASSED" : "FAILED");
              printf "| **Branches** | %d | %d | %d | **%.2f%%** | %s |\n", br_tot, br_c, br_m, br_pct, (br_pct >= 80 ? "PASSED" : "FAILED");
              printf "| **Lines** | %d | %d | %d | **%.2f%%** | %s |\n", ln_tot, ln_c, ln_m, ln_pct, (ln_pct >= 80 ? "PASSED" : "FAILED");
              printf "| **Methods** | %d | %d | %d | **%.2f%%** | %s |\n", mtd_tot, mtd_c, mtd_m, mtd_pct, (mtd_pct >= 80 ? "PASSED" : "FAILED");
              printf "| **Classes** | %d | %d | %d | **%.2f%%** | %s |\n", cls_total, cls_covered, cls_missed, cls_pct, (cls_pct >= 80 ? "PASSED" : "FAILED");
            }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          else
            echo "JaCoCo coverage CSV file not found."
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

  docker-independence-acceptance:
    name: Independence Acceptance Test (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run Independence Acceptance Test
        run: |
          ./scripts/independence-acceptance.sh | tee acceptance-output.txt
          
          echo "## Docker Independence Acceptance Report" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Multi-Container Stack (App + Postgres + OTel)** | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tenant & User Registration** | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Resource & Relationship Creation** | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **POST /api/v1/authorize (ReBAC Matrix)** | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Audit Log Durability** | PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **OpenAPI v3 Specification** | PASSED |" >> $GITHUB_STEP_SUMMARY

      - name: Inspect Docker logs on failure
        if: failure()
        run: docker compose logs
