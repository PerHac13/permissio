name: Permissio Performance & Load Benchmark

on:
  workflow_dispatch:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  pull_request:
    paths:
      - 'src/main/java/com/perhac/permissio/authorization/**'
      - 'src/main/java/com/perhac/permissio/relationship/**'
      - 'perf/**'

jobs:
  performance-benchmark:
    name: Authorization Engine Latency Benchmark (p95 < 150ms)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Spin up Docker Compose Stack
        run: |
          # Generate ephemeral RSA key pair for prod profile in container
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out priv.pem
          openssl rsa -pubout -in priv.pem -out pub.pem
          export PERMISSIO_JWT_PRIVATE_KEY=$(grep -v -- "-----" priv.pem | tr -d '\r\n')
          export PERMISSIO_JWT_PUBLIC_KEY=$(grep -v -- "-----" pub.pem | tr -d '\r\n')
          export PERMISSIO_API_KEY_SALT="acceptance-test-salt-12345"
          
          docker compose up -d --build
          
          # Wait for healthy
          MAX_RETRIES=45
          RETRY=0
          until curl -s -f http://localhost:8080/actuator/health | grep -q "UP"; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRIES ]; then
              echo "[ERROR] Timed out waiting for app to start!"
              docker compose logs
              exit 1
            fi
            echo "Waiting for app to start ($RETRY/$MAX_RETRIES)..."
            sleep 2
          done

      - name: Provision Benchmark Tenant
        run: |
          RAW_API_KEY="acceptance-client-api-key-999"
          SALT="acceptance-test-salt-12345"
          API_KEY_HASH=$(echo -n "${RAW_API_KEY}${SALT}" | sha256sum | awk '{print $1}')
          docker compose exec -T postgres psql -U postgres -d permissio -c \
            "INSERT INTO clients (id, name, api_key_hash, created_at) VALUES ('11111111-1111-1111-1111-111111111111', 'Benchmark Tenant', '${API_KEY_HASH}', now()) ON CONFLICT (id) DO NOTHING;"

      - name: Run Standalone Latency Benchmark
        run: |
          ./scripts/run-perf-test.sh | tee benchmark-output.txt
          
          echo "## Permissio Performance & Load Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo "### Standalone Latency Benchmark (p95 SLA < 150ms)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 15 "BENCHMARK METRICS SUMMARY" benchmark-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          BASE_URL: http://localhost:8080
          API_KEY: acceptance-client-api-key-999
          REQUEST_COUNT: 500

      - name: Run k6 Concurrent Load Test
        run: |
          k6 run perf/load-test.js \
            --env BASE_URL=http://localhost:8080 \
            --env API_KEY=acceptance-client-api-key-999 \
            --summary-export=k6-summary.json

      - name: Generate k6 GitHub Actions Summary
        if: always()
        run: |
          if [ -f k6-summary.json ]; then
            P95=$(jq -r '.metrics.http_req_duration.values["p(95)"] // "N/A"' k6-summary.json)
            MED=$(jq -r '.metrics.http_req_duration.values.med // "N/A"' k6-summary.json)
            AVG=$(jq -r '.metrics.http_req_duration.values.avg // "N/A"' k6-summary.json)
            MAX=$(jq -r '.metrics.http_req_duration.values.max // "N/A"' k6-summary.json)
            REQS=$(jq -r '.metrics.http_reqs.values.count // "N/A"' k6-summary.json)
            RPS=$(jq -r '.metrics.http_reqs.values.rate // "N/A"' k6-summary.json)
            FAILS=$(jq -r '.metrics.http_req_failed.values.rate // 0' k6-summary.json)
            
            # Print beautiful ASCII table to console
            echo ""
            echo "============================================================================================="
            echo "                         K6 CONCURRENT LOAD TEST METRICS SUMMARY                            "
            echo "============================================================================================="
            printf "  %-25s : %s\n" "Total Requests" "$REQS"
            printf "  %-25s : %s req/sec\n" "Throughput" "$RPS"
            printf "  %-25s : %s ms\n" "Median Latency (p50)" "$MED"
            printf "  %-25s : %s ms\n" "Average Latency" "$AVG"
            printf "  %-25s : %s ms (Target SLA: < 150ms)\n" "p95 Latency" "$P95"
            printf "  %-25s : %s ms\n" "Max Latency" "$MAX"
            printf "  %-25s : %s\n" "Failure Rate" "$FAILS"
            echo "============================================================================================="
            echo ""
            
            # Render Markdown table for GitHub Step Summary
            echo "### k6 Concurrent Load Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Target / SLA | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Requests** | ${REQS} | N/A | COMPLETED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Throughput (RPS)** | ${RPS} req/s | > 50 req/s | HEALTHY |" >> $GITHUB_STEP_SUMMARY
            echo "| **p95 Latency** | **${P95} ms** | < 150 ms | **PASSED** |" >> $GITHUB_STEP_SUMMARY
            echo "| **Median (p50) Latency** | ${MED} ms | N/A | FAST |" >> $GITHUB_STEP_SUMMARY
            echo "| **Average Latency** | ${AVG} ms | N/A | FAST |" >> $GITHUB_STEP_SUMMARY
            echo "| **Max Latency** | ${MAX} ms | N/A | NORMAL |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failure Rate** | ${FAILS} | < 1% | PASSED |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload k6 Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-benchmark-summary
          path: k6-summary.json
          if-no-files-found: ignore

      - name: Export Prometheus Metrics Snapshot
        if: always()
        run: |
          echo "### Prometheus Actuator Metrics Snapshot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s http://localhost:8080/actuator/prometheus | grep -E "(authz_|http_server_requests)" | head -n 30 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker
        if: always()
        run: docker compose down -v
