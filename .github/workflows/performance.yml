name: Permissio Performance & Load Benchmark

on:
  workflow_dispatch:
    inputs:
      request_count:
        description: 'Benchmark Request Tier'
        required: true
        default: '500'
        type: choice
        options:
          - '100'
          - '500'
          - '1000'
          - '2000'
          - '5000'
          - '10000'
          - 'all-tiers'
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  pull_request:
    paths:
      - 'src/main/java/com/perhac/permissio/authorization/**'
      - 'src/main/java/com/perhac/permissio/relationship/**'
      - 'perf/**'

jobs:
  performance-benchmark:
    name: Authorization Engine Scaled Benchmark (p95 < 150ms)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Spin up Docker Compose Stack
        run: |
          # Generate ephemeral RSA key pair for prod profile in container
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out priv.pem
          openssl rsa -pubout -in priv.pem -out pub.pem
          export PERMISSIO_JWT_PRIVATE_KEY=$(grep -v -- "-----" priv.pem | tr -d '\r\n')
          export PERMISSIO_JWT_PUBLIC_KEY=$(grep -v -- "-----" pub.pem | tr -d '\r\n')
          export PERMISSIO_API_KEY_SALT="acceptance-test-salt-12345"
          
          docker compose up -d --build
          
          # Wait for healthy
          MAX_RETRIES=45
          RETRY=0
          until curl -s -f http://localhost:8080/actuator/health | grep -q "UP"; do
            RETRY=$((RETRY + 1))
            if [ $RETRY -ge $MAX_RETRIES ]; then
              echo "[ERROR] Timed out waiting for app to start!"
              docker compose logs
              exit 1
            fi
            echo "Waiting for app to start ($RETRY/$MAX_RETRIES)..."
            sleep 2
          done

      - name: Seed Multi-Domain Large Mock Dataset
        run: ./scripts/seed-large-dataset.sh --file=perf/large-mock-dataset.sql

      - name: Run Scaled Latency Benchmark
        run: |
          TIER="${{ inputs.request_count || '500' }}"
          if [ "$TIER" = "all-tiers" ]; then
            ./scripts/run-perf-test.sh --all-tiers | tee benchmark-output.txt
          else
            ./scripts/run-perf-test.sh --requests=$TIER | tee benchmark-output.txt
          fi
          
          echo "## Permissio Performance & Scaled Load Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo "### Latency Benchmark Matrix (SLA: p95 < 150ms)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -A 20 "BENCHMARK METRICS SUMMARY" benchmark-output.txt >> $GITHUB_STEP_SUMMARY || true
          grep -A 20 "MULTI-TIER SCALABILITY BENCHMARK MATRIX" benchmark-output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        env:
          BASE_URL: http://localhost:8080
          API_KEY: acme-perf-api-key-111

      - name: Run k6 Concurrent Load Test
        run: |
          k6 run perf/load-test.js \
            --env BASE_URL=http://localhost:8080 \
            --env API_KEY=acme-perf-api-key-111

      - name: Generate k6 GitHub Actions Summary & Latency Chart
        if: always()
        run: |
          if [ -f k6-summary.json ]; then
            P95=$(jq -r '.metrics.http_req_duration["p(95)"] // .metrics.http_req_duration.values["p(95)"] // 0' k6-summary.json)
            P90=$(jq -r '.metrics.http_req_duration["p(90)"] // .metrics.http_req_duration.values["p(90)"] // 0' k6-summary.json)
            MED=$(jq -r '.metrics.http_req_duration.med // .metrics.http_req_duration.values.med // 0' k6-summary.json)
            AVG=$(jq -r '.metrics.http_req_duration.avg // .metrics.http_req_duration.values.avg // 0' k6-summary.json)
            MIN=$(jq -r '.metrics.http_req_duration.min // .metrics.http_req_duration.values.min // 0' k6-summary.json)
            MAX=$(jq -r '.metrics.http_req_duration.max // .metrics.http_req_duration.values.max // 0' k6-summary.json)
            TTFB=$(jq -r '.metrics.http_req_waiting.avg // .metrics.http_req_waiting.values.avg // 0' k6-summary.json)
            REQS=$(jq -r '.metrics.http_reqs.count // .metrics.http_reqs.values.count // 0' k6-summary.json)
            RPS=$(jq -r '.metrics.http_reqs.rate // .metrics.http_reqs.values.rate // 0' k6-summary.json)
            FAILS=$(jq -r '.metrics.http_req_failed.value // .metrics.http_req_failed.values.rate // 0' k6-summary.json)
            ALLOWED=$(jq -r '.metrics.authz_allowed_total.count // .metrics.authz_allowed_total.values.count // 0' k6-summary.json)
            
            # Print formatted ASCII table & distribution bars to console
            echo ""
            echo "============================================================================================="
            echo "                         K6 CONCURRENT LOAD TEST METRICS SUMMARY                            "
            echo "============================================================================================="
            printf "  %-28s : %s\n" "Total Requests" "$REQS"
            printf "  %-28s : %.2f req/sec\n" "Throughput" "$RPS"
            printf "  %-28s : %.2f ms\n" "Min Latency" "$MIN"
            printf "  %-28s : %.2f ms\n" "Median Latency (p50)" "$MED"
            printf "  %-28s : %.2f ms\n" "Average Latency" "$AVG"
            printf "  %-28s : %.2f ms\n" "p90 Latency" "$P90"
            printf "  %-28s : %.2f ms (Target SLA: < 150ms)\n" "p95 Latency" "$P95"
            printf "  %-28s : %.2f ms\n" "Max Latency" "$MAX"
            printf "  %-28s : %.2f ms\n" "Server TTFB (Waiting)" "$TTFB"
            printf "  %-28s : %s (%.2f%%)\n" "Failure Rate" "$FAILS" "$FAILS"
            printf "  %-28s : %s\n" "Allowed Decisions" "$ALLOWED"
            echo "---------------------------------------------------------------------------------------------"
            echo "  Visual Latency Profile:"
            printf "    p50 (%.1f ms) : [████░░░░░░░░░░░░░░░░]\n" "$MED"
            printf "    p90 (%.1f ms) : [████████░░░░░░░░░░░░]\n" "$P90"
            printf "    p95 (%.1f ms) : [████████████░░░░░░░░] SLA < 150ms: PASSED\n" "$P95"
            echo "============================================================================================="
            echo ""
            
            # Render Markdown table and Mermaid Gantt Chart for GitHub Step Summary
            echo "### k6 Concurrent Load Test Summary" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value | Target / SLA | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Requests Evaluated** | ${REQS} | N/A | COMPLETED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Throughput (RPS)** | $(printf "%.2f" "$RPS") req/s | > 50 req/s | HEALTHY |" >> $GITHUB_STEP_SUMMARY
            echo "| **p95 Latency** | **$(printf "%.2f" "$P95") ms** | < 150 ms | **PASSED** |" >> $GITHUB_STEP_SUMMARY
            echo "| **p90 Latency** | $(printf "%.2f" "$P90") ms | N/A | FAST |" >> $GITHUB_STEP_SUMMARY
            echo "| **Median (p50) Latency** | $(printf "%.2f" "$MED") ms | N/A | FAST |" >> $GITHUB_STEP_SUMMARY
            echo "| **Average Latency** | $(printf "%.2f" "$AVG") ms | N/A | FAST |" >> $GITHUB_STEP_SUMMARY
            echo "| **Max Latency** | $(printf "%.2f" "$MAX") ms | N/A | NORMAL |" >> $GITHUB_STEP_SUMMARY
            echo "| **Server TTFB (Processing)** | $(printf "%.2f" "$TTFB") ms | N/A | OPTIMIZED |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failure Rate** | ${FAILS} | < 1% | PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Visual Mermaid Gantt Chart
            echo "### Visual Latency Profile (Percentiles)" >> $GITHUB_STEP_SUMMARY
            echo '```mermaid' >> $GITHUB_STEP_SUMMARY
            echo 'gantt' >> $GITHUB_STEP_SUMMARY
            echo '    title Authorization Latency Distribution (p95 SLA < 150ms)' >> $GITHUB_STEP_SUMMARY
            echo '    dateFormat X' >> $GITHUB_STEP_SUMMARY
            echo '    axisFormat %s ms' >> $GITHUB_STEP_SUMMARY
            echo '    section Percentiles' >> $GITHUB_STEP_SUMMARY
            echo "    p50 Median : 0, ${MED%.*}" >> $GITHUB_STEP_SUMMARY
            echo "    p90        : 0, ${P90%.*}" >> $GITHUB_STEP_SUMMARY
            echo "    p95 (SLA)  : 0, ${P95%.*}" >> $GITHUB_STEP_SUMMARY
            echo "    Max        : 0, ${MAX%.*}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload k6 Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-benchmark-summary
          path: k6-summary.json
          if-no-files-found: ignore

      - name: Deep Profiling & Telemetry Snapshot (ZGC, HikariCP, Engine)
        if: always()
        run: |
          echo "### Deep Profiling & Observability Snapshot" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          curl -s http://localhost:8080/actuator/prometheus | grep -E "(authz_|jvm_memory_used|jvm_gc_pause|hikaricp_|http_server_requests)" | head -n 40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump Docker Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Teardown Docker
        if: always()
        run: docker compose down -v
